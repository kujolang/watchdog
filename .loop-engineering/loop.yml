objective: "Audit HLP-011 watchdog configuration normalization and retain multi-source/security policy helpers unless native env access can preserve behavior exactly."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: kujo_checks
    command: "for f in dashboard_server.kujo src/*.kujo watchdog.kujo; do /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check $f >/dev/null || exit 1; done"
  - id: static_tests
    command: "export KUJO_BIN=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo; for f in tests/*.js; do node $f || exit 1; done"
  - id: compat_entrypoints
    command: "node scripts/sync_compat_entrypoints.js --check"
  - id: diff_check
    command: "git diff --check -- $(git diff --name-only | grep -v '^.loop-engineering/' || true)"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
